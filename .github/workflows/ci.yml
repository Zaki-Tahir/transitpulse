name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: transitpulse
          POSTGRES_PASSWORD: transitpulse
          POSTGRES_DB: transitpulse_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U transitpulse" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      TP_DATABASE_URL: postgresql://transitpulse:transitpulse@localhost:5432/transitpulse_test
      TP_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy transitpulse
      - name: Unit and integration tests
        run: uv run pytest -q

  web:
    name: Web (lint, typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  helm:
    name: Helm chart (lint, render, schema check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/transitpulse
      - name: Validate rendered manifests against Kubernetes schemas
        run: |
          helm template tp deploy/helm/transitpulse > rendered.yaml
          docker run --rm -v "$PWD/rendered.yaml:/r.yaml" ghcr.io/yannh/kubeconform:latest -strict -summary /r.yaml

  e2e:
    name: End-to-end (Playwright, full stack in Docker)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate fixture feeds
        working-directory: backend
        run: uv run python -m tests.e2e_fixtures ../data/e2e
      - name: Start the stack
        run: docker compose -p transitpulse-e2e -f docker-compose.yml -f docker-compose.e2e.yml --profile app up -d --build --wait
      - name: Install Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: web
        run: npx playwright test
      - name: Stack logs
        if: failure()
        run: docker compose -p transitpulse-e2e logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
