apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tp.name" . }}-api
  labels: {{- include "tp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "tp.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tp.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext: {{- include "tp.podSecurity" . | nindent 8 }}
      initContainers: {{- include "tp.migrateInit" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "tp.apiImage" . }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          env: {{- include "tp.backendEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "tp.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tp.name" . }}-api
  labels: {{- include "tp.labels" . | nindent 4 }}
spec:
  selector: {{- include "tp.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tp.name" . }}-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "tp.selector" (dict "root" . "component" "api") | nindent 6 }}
{{- if .Values.api.autoscaling.enabled }}
---
# WebSocket fan-out and JSON encoding are CPU-bound, so scale API pods on CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "tp.name" . }}-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "tp.name" . }}-api }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
