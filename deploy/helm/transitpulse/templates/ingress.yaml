{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tp.name" . }}
  labels: {{- include "tp.labels" . | nindent 4 }}
  annotations:
    # Browsers hold the /ws connection open for as long as the tab is open.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API and WebSocket go straight to the API pods; everything else is the web app.
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ include "tp.name" . }}-api, port: { name: http } } }
          - path: /ws
            pathType: Exact
            backend: { service: { name: {{ include "tp.name" . }}-api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "tp.name" . }}-web, port: { name: http } } }
{{- end }}
