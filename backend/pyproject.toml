[project]
name = "transitpulse"
version = "0.1.0"
description = "Live NYC subway map: GTFS-realtime ingestion, position estimates and WebSocket deltas"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "redis>=5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-protobuf>=7.35.1.20260906",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs PostGIS and Redis (docker compose up -d)"]
